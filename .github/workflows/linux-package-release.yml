# 构建 DeepSeek Harness 桌面版 Linux x64 包（AppImage + deb）并发布 GitHub Release。
# 支持两个分支：linux-custom-titlebar（定制优化版）与 linux-package-official（官方上游版）。
# 文件名含分支标识以区分，发布说明中英双语。
name: Linux x64 打包与发布 (AppImage + deb)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '构建分支：linux-custom-titlebar（定制版）/ linux-package-official（官方版）'
        type: choice
        options:
          - linux-custom-titlebar
          - linux-package-official
        default: linux-custom-titlebar
        required: true
      publish:
        description: '发布 GitHub Release 并上传制品'
        type: boolean
        default: true
        required: false

permissions:
  contents: write

concurrency:
  group: linux-x64-package-${{ github.event.inputs.branch }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: 构建 ${{ github.event.inputs.branch }} · AppImage + deb
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: 识别分支类型与产品名称
        id: branch
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          if [ "$BRANCH" = "linux-custom-titlebar" ]; then
            echo "slug=custom" >> "$GITHUB_OUTPUT"
            echo "name_suffix=定制优化版" >> "$GITHUB_OUTPUT"
            echo "name_suffix_en=Custom Edition" >> "$GITHUB_OUTPUT"
          else
            echo "slug=official" >> "$GITHUB_OUTPUT"
            echo "name_suffix=官方上游版" >> "$GITHUB_OUTPUT"
            echo "name_suffix_en=Official Upstream Edition" >> "$GITHUB_OUTPUT"
          fi

      - name: 配置缓存目录
        run: |
          echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"
          echo "npm_config_devdir=${{ runner.temp }}/node-gyp" >> "$GITHUB_ENV"
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: 配置 pnpm store
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: 安装依赖（不变更 lockfile）
        run: pnpm install --frozen-lockfile

      - name: 构建官方 workspace
        run: pnpm run build:official

      - name: 打包 Linux AppImage + deb
        run: bash package-linux.sh

      - name: 确定版本号
        id: version
        run: |
          V=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version=$V"

      - name: 计算 SHA256SUMS
        run: |
          cd apps/desktop/.desktop-build/targets/linux-x64/artifacts
          sha256sum *.AppImage *.deb > "SHA256SUMS.${{ steps.branch.outputs.slug }}-${{ steps.version.outputs.version }}"

      - name: 上传构建制品
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-x64-${{ steps.branch.outputs.slug }}-${{ steps.version.outputs.version }}
          path: |
            apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.AppImage
            apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.deb
            apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.yml
            apps/desktop/.desktop-build/targets/linux-x64/artifacts/SHA256SUMS.*
          if-no-files-found: error
          retention-days: 30

      - name: 发布 GitHub Release（${{ steps.branch.outputs.name_suffix }}）
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SLUG="${{ steps.branch.outputs.slug }}"
          SUFFIX_CN="${{ steps.branch.outputs.name_suffix }}"
          SUFFIX_EN="${{ steps.branch.outputs.name_suffix_en }}"
          ARTIFACTS="apps/desktop/.desktop-build/targets/linux-x64/artifacts"
          TAG="v${VERSION}-linux-x64-${SLUG}"
          BRANCH="${{ github.event.inputs.branch }}"

          NOTES=$(cat <<EOF
          # DeepSeek Harness ${VERSION} · Linux x64 · ${SUFFIX_EN}
          ## DeepSeek Harness ${VERSION} · Linux x64 · ${SUFFIX_CN}

          源码分支：\`${BRANCH}\`
          Source branch: \`${BRANCH}\`

          **制品 / Artifacts**

          | 文件 | 类型 |
          |------|------|
          | \`deepseek-harness-${VERSION}-linux-x64.AppImage\` | 可执行包 / Portable binary |
          | \`deepseek-harness_${VERSION}_amd64.deb\` | Debian 安装包 / Installer |

          **安装 / Installation**

          \`\`\`bash
          # AppImage
          chmod +x deepseek-harness-${VERSION}-linux-x64.AppImage
          ./deepseek-harness-${VERSION}-linux-x64.AppImage

          # deb
          sudo dpkg -i deepseek-harness_${VERSION}_amd64.deb
          \`\`\`

          **校验 / Verification**

          下载后请核对 SHA256SUMS 文件中对应包的哈希值。
          Please verify the downloaded files against the SHA256SUMS checksums.
          EOF
          )

          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "$ARTIFACTS"/*.AppImage \
            "$ARTIFACTS"/*.deb \
            "$ARTIFACTS"/SHA256SUMS.* \
            "$ARTIFACTS"/*.yml \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "DeepSeek Harness ${VERSION} (Linux x64 · ${SUFFIX_CN})" \
            --notes "$NOTES" \
            --prerelease

      - name: 刷新 linux-latest 自动更新源（仅定制版）
        if: inputs.publish && github.event.inputs.branch == 'linux-custom-titlebar'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACTS="apps/desktop/.desktop-build/targets/linux-x64/artifacts"
          LATEST_TAG="linux-latest"
          LATEST_NOTES=$(cat <<EOF
          # DeepSeek Harness ${VERSION} (Linux x64 · 定制优化版 · 自动更新源)
          # DeepSeek Harness ${VERSION} (Linux x64 · Custom Edition · Auto-update Feed)

          该 Release 是应用内「检查更新」的稳定更新源，每次云端构建都会刷新为最新版本。

          This release is the auto-update feed for the in-app update checker.
          It is refreshed with every cloud build.

          **安装 / Installation**

          \`\`\`bash
          chmod +x deepseek-harness-${VERSION}-linux-x64.AppImage
          ./deepseek-harness-${VERSION}-linux-x64.AppImage
          \`\`\`

          版本化发布见 / Versioned release: \`v${VERSION}-linux-x64-custom\`
          EOF
          )
          gh release delete "$LATEST_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$LATEST_TAG" \
            "$ARTIFACTS"/*.AppImage \
            "$ARTIFACTS"/*.deb \
            "$ARTIFACTS"/SHA256SUMS.* \
            "$ARTIFACTS"/*.yml \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "DeepSeek Harness ${VERSION} (Linux x64 · latest)" \
            --notes "$LATEST_NOTES" \
            --prerelease