          2. **去除原生菜单栏** — 抑制 GTK 菜单栏泄漏的调试项，界面更干净
          3. **系统托盘** — 关闭后驻留托盘，托盘图标可快速「显示窗口 / 退出」
          4. **关闭行为可配置** — 通用设置可选「隐藏到托盘（默认）」或「退出应用」
          5. **桌面通知** — 后台任务、审核请求、模型提问等场景弹出原生通知，通知分类可精细开关
          6. **自动更新** — 应用内「检查更新」指向此 `linux-latest` 自动更新源，AppImage 支持自动下载安装

          ### 自动更新源

          此 Release 是 DeepSeek Harness Linux x64 **定制优化版** 的自动更新源。每次云端构建成功后，GitHub Actions 自动刷新此 Release 至最新版本。应用内「检查更新」即读取此页面的制品元数据判断是否有新版本。

          | 属性 | 值 |
          |------|-----|
          | 当前版本 | __VERSION__ |
          | 来源分支 | `linux-custom-titlebar` |
          | 构建环境 | GitHub Actions · ubuntu-24.04 |
          | 更新方式 | 应用内「通用设置 → 检查更新」，AppImage 自动下载安装 |

          版本化独立构建见：[`v__VERSION__-linux-x64-custom`](https://github.com/yaoyingkeji/deepseek-harness/releases/tag/v__VERSION__-linux-x64-custom)

