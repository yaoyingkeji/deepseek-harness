          > 仓库地址：[yaoyingkeji/deepseek-harness](https://github.com/yaoyingkeji/deepseek-harness)（分支 `linux-package-official`）

          #### 与上游的区别

          本分支**仅额外注入 Linux 打包基础设施**，不做任何 UI 或功能性修改：

          - `linux-x64` 构建目标与 `electron-builder` 配置
