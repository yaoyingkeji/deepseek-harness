          - 分支：`linux-package-official`（官方上游版）
          - 构建触发：代码推送自动构建并发布
          - 构建环境：GitHub Actions · ubuntu-24.04

          ---

          ## English

          This release is built automatically by GitHub Actions on a **ubuntu-24.04** runner from the `linux-package-official` branch.

          ### Branch Description

          An **official upstream build** of [deepseek-ai/deepseek-harness](https://github.com/deepseek-ai/deepseek-harness), functionally identical to upstream `master`.

          > Repository: [yaoyingkeji/deepseek-harness](https://github.com/yaoyingkeji/deepseek-harness) (branch `linux-package-official`)

          #### Differences from Upstream

          This branch **only adds Linux packaging infrastructure** — no UI or functional changes:

          - `linux-x64` build target and `electron-builder` configuration
          - `package-linux.sh` one-shot packaging script
          - In-app "Check for Updates" points to the `linux-latest-official` auto-update feed

          Ideal for users who want the authentic upstream experience with the convenience of auto-update.

          #### Automatic Builds

          Every push to this branch (except README / docs) triggers a cloud build, which upon success:

          - Publishes a versioned Release (this page)
          - Refreshes the `linux-latest-official` auto-update feed

          ### Artifacts

          | Artifact | Type | Description |
          |----------|------|-------------|
          | `deepseek-harness-__VERSION__-linux-x64.AppImage` | AppImage | Portable — make executable and run |
          | `deepseek-harness___VERSION___amd64.deb` | deb | Debian / Ubuntu system package |
          | `SHA256SUMS.official-__VERSION__` | Checksums | Verify file integrity after download |

          ### Installation

          ```bash
          # AppImage
          chmod +x deepseek-harness-__VERSION__-linux-x64.AppImage
          ./deepseek-harness-__VERSION__-linux-x64.AppImage

          # deb
          sudo dpkg -i deepseek-harness___VERSION___amd64.deb
          ```

          ### Build Info

          - Version: __VERSION__
          - Branch: `linux-package-official` (Official Upstream Edition)
          - Trigger: automatic on push
          - Runner: GitHub Actions · ubuntu-24.04

          ---

          源码 / Source: https://github.com/deepseek-ai/deepseek-harness
          Fork: https://github.com/yaoyingkeji/deepseek-harness
          NOTES_EOF
          )
          NOTES="${NOTES//__VERSION__/$VERSION}"
          fi

          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "$ARTIFACTS"/*.AppImage \
            "$ARTIFACTS"/*.deb \
            "$ARTIFACTS"/SHA256SUMS.* \
            "$ARTIFACTS"/*.yml \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "DeepSeek Harness ${VERSION} (Linux x64 · ${SUFFIX_CN})" \
            --notes "$NOTES" \
            --prerelease

      - name: 刷新 linux-latest 自动更新源（仅定制版）
        if: (github.event_name == 'push' || inputs.publish) && env.BUILD_BRANCH == 'linux-custom-titlebar'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACTS="apps/desktop/.desktop-build/targets/linux-x64/artifacts"
          LATEST_TAG="linux-latest"
          LATEST_NOTES=$(cat <<'LATEST_EOF'
