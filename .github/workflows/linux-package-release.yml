          An **official upstream build** of [deepseek-ai/deepseek-harness](https://github.com/deepseek-ai/deepseek-harness), functionally identical to upstream `master`.

          > Repository: [yaoyingkeji/deepseek-harness](https://github.com/yaoyingkeji/deepseek-harness) (branch `linux-package-official`)

          This branch **only adds Linux packaging infrastructure** — no UI or functional changes:

          - `linux-x64` build target and `electron-builder` configuration
          - `package-linux.sh` one-shot packaging script
          - In-app "Check for Updates" points to this `linux-latest-official` auto-update feed

          Ideal for users who want the authentic upstream experience with the convenience of auto-update.

          ### Auto-Update Feed

          This release is the **auto-update feed** for DeepSeek Harness Linux x64 Official Edition. After every successful cloud build, GitHub Actions automatically refreshes this release to the latest version. The in-app "Check for Updates" reads artifact metadata from this page to detect new versions.

          | Property | Value |
          |----------|-------|
          | Current Version | __VERSION__ |
          | Source Branch | `linux-package-official` |
          | Runner | GitHub Actions · ubuntu-24.04 |
          | Update Method | In-app "General Settings → Check for Updates"; AppImage auto-downloads and installs |

          Versioned build: [`v__VERSION__-linux-x64-official`](https://github.com/yaoyingkeji/deepseek-harness/releases/tag/v__VERSION__-linux-x64-official)

          Browse & download: [Releases page](https://github.com/yaoyingkeji/deepseek-harness/releases)

          ---

          源码 / Source: https://github.com/deepseek-ai/deepseek-harness
          Fork: https://github.com/yaoyingkeji/deepseek-harness
          LATEST_EOF
          )
          LATEST_NOTES="${LATEST_NOTES//__VERSION__/$VERSION}"
          gh release delete "$LATEST_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$LATEST_TAG" \
            "$ARTIFACTS"/*.AppImage \
            "$ARTIFACTS"/*.deb \
            "$ARTIFACTS"/SHA256SUMS.* \
            "$ARTIFACTS"/*.yml \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "DeepSeek Harness ${VERSION} (Linux x64 · latest-official)" \
            --notes "$LATEST_NOTES" \
            --prerelease

      - name: 同步 README 状态表
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="${BUILD_BRANCH}"
          VERSION="${{ steps.version.outputs.version }}"
          # checkout 使用 persist-credentials: false，这里为状态提交单独配置凭据
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # 交给 Node 脚本处理 README 状态段，避免 sed 处理多语言表格出错
          node .github/scripts/sync-readme-status.mjs "$BRANCH" "$VERSION" "${{ steps.branch.outputs.slug }}"
