# 构建 DeepSeek Harness 桌面版 Linux x64 包（AppImage + deb）并发布 GitHub Release。
# 支持两个分支：linux-custom-titlebar（定制优化版）与 linux-package-official（官方上游版）。
# 文件名含分支标识以区分，发布说明中英双语。
name: Linux x64 打包与发布 (AppImage + deb)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '构建分支：linux-custom-titlebar（定制版）/ linux-package-official（官方版）'
        type: choice
        options:
          - linux-custom-titlebar
          - linux-package-official
        default: linux-custom-titlebar
        required: true
      publish:
        description: '发布 GitHub Release 并上传制品'
        type: boolean
        default: true
        required: false

permissions:
  contents: write

concurrency:
  group: linux-x64-package-${{ github.event.inputs.branch }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: 构建 ${{ github.event.inputs.branch }} · AppImage + deb
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: 识别分支类型与产品名称
        id: branch
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          if [ "$BRANCH" = "linux-custom-titlebar" ]; then
            echo "slug=custom" >> "$GITHUB_OUTPUT"
            echo "name_suffix=定制优化版" >> "$GITHUB_OUTPUT"
            echo "name_suffix_en=Custom Edition" >> "$GITHUB_OUTPUT"
          else
            echo "slug=official" >> "$GITHUB_OUTPUT"
            echo "name_suffix=官方上游版" >> "$GITHUB_OUTPUT"
            echo "name_suffix_en=Official Upstream Edition" >> "$GITHUB_OUTPUT"
          fi

      - name: 配置缓存目录
        run: |
          echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"
          echo "npm_config_devdir=${{ runner.temp }}/node-gyp" >> "$GITHUB_ENV"
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: 配置 pnpm store
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: 安装依赖（不变更 lockfile）
        run: pnpm install --frozen-lockfile

      - name: 构建官方 workspace
        run: pnpm run build:official

      - name: 打包 Linux AppImage + deb
        run: bash package-linux.sh

      - name: 确定版本号
        id: version
        run: |
          V=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version=$V"

      - name: 计算 SHA256SUMS
        run: |
          cd apps/desktop/.desktop-build/targets/linux-x64/artifacts
          sha256sum *.AppImage *.deb > "SHA256SUMS.${{ steps.branch.outputs.slug }}-${{ steps.version.outputs.version }}"

      - name: 上传构建制品
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-x64-${{ steps.branch.outputs.slug }}-${{ steps.version.outputs.version }}
          path: |
            apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.AppImage
            apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.deb
            apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.yml
            apps/desktop/.desktop-build/targets/linux-x64/artifacts/SHA256SUMS.*
          if-no-files-found: error
          retention-days: 30

      - name: 发布 GitHub Release（${{ steps.branch.outputs.name_suffix }}）
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SLUG="${{ steps.branch.outputs.slug }}"
          SUFFIX_CN="${{ steps.branch.outputs.name_suffix }}"
          SUFFIX_EN="${{ steps.branch.outputs.name_suffix_en }}"
          ARTIFACTS="apps/desktop/.desktop-build/targets/linux-x64/artifacts"
          TAG="v${VERSION}-linux-x64-${SLUG}"
          BRANCH="${{ github.event.inputs.branch }}"

          NOTES=$(cat <<EOF
          ## :cn: 中文

          本 Release 由 GitHub Actions 在 **ubuntu-24.04** 云端自动构建，源码来自 \`${BRANCH}\` 分支。

          | 制品 | 类型 | 说明 |
          |------|------|------|
          | \`deepseek-harness-${VERSION}-linux-x64.AppImage\` | AppImage | 免安装，添加执行权限即可运行 |
          | \`deepseek-harness_${VERSION}_amd64.deb\` | deb | Debian / Ubuntu 系统安装包 |
          | \`SHA256SUMS.${SLUG}-${VERSION}\` | 校验文件 | 下载后请核对哈希值，确保文件完整 |

          ### 安装

          \`\`\`bash
          # AppImage
          chmod +x deepseek-harness-${VERSION}-linux-x64.AppImage
          ./deepseek-harness-${VERSION}-linux-x64.AppImage

          # deb
          sudo dpkg -i deepseek-harness_${VERSION}_amd64.deb
          \`\`\`

          ### 版本信息

          - 版本号：${VERSION}
          - 分支：\`${BRANCH}\`（${SUFFIX_CN}）
          - 构建环境：GitHub Actions · ubuntu-24.04

          ---

          ## :us: English

          This release is built automatically by GitHub Actions on a **ubuntu-24.04** runner from the \`${BRANCH}\` branch.

          | Artifact | Type | Description |
          |----------|------|-------------|
          | \`deepseek-harness-${VERSION}-linux-x64.AppImage\` | AppImage | Portable — make executable and run |
          | \`deepseek-harness_${VERSION}_amd64.deb\` | deb | Debian / Ubuntu system package |
          | \`SHA256SUMS.${SLUG}-${VERSION}\` | Checksums | Verify file integrity after download |

          ### Installation

          \`\`\`bash
          # AppImage
          chmod +x deepseek-harness-${VERSION}-linux-x64.AppImage
          ./deepseek-harness-${VERSION}-linux-x64.AppImage

          # deb
          sudo dpkg -i deepseek-harness_${VERSION}_amd64.deb
          \`\`\`

          ### Build Info

          - Version: ${VERSION}
          - Branch: \`${BRANCH}\` (${SUFFIX_EN})
          - Runner: GitHub Actions · ubuntu-24.04

          ---

          源码 / Source: https://github.com/deepseek-ai/deepseek-harness
          Fork: https://github.com/yaoyingkeji/deepseek-harness
          EOF
          )

          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "$ARTIFACTS"/*.AppImage \
            "$ARTIFACTS"/*.deb \
            "$ARTIFACTS"/SHA256SUMS.* \
            "$ARTIFACTS"/*.yml \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "DeepSeek Harness ${VERSION} (Linux x64 · ${SUFFIX_CN})" \
            --notes "$NOTES" \
            --prerelease

      - name: 刷新 linux-latest 自动更新源（仅定制版）
        if: inputs.publish && github.event.inputs.branch == 'linux-custom-titlebar'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACTS="apps/desktop/.desktop-build/targets/linux-x64/artifacts"
          LATEST_TAG="linux-latest"
          LATEST_NOTES=$(cat <<EOF
          ## :cn: 中文

          此 Release 是 DeepSeek Harness Linux x64 **定制优化版**的自动更新源。每次云端构建成功后会刷新至此版本，供应用内「检查更新」使用。

          - 版本：${VERSION}
          - 构建环境：GitHub Actions · ubuntu-24.04

          ### 安装

          \`\`\`bash
          chmod +x deepseek-harness-${VERSION}-linux-x64.AppImage
          ./deepseek-harness-${VERSION}-linux-x64.AppImage
          \`\`\`

          按版本发布的独立构建见：\`v${VERSION}-linux-x64-custom\`

          ---

          ## :us: English

          This release is the **auto-update feed** for DeepSeek Harness Linux x64 Custom Edition. It is refreshed with every successful cloud build and consumed by the in-app update checker.

          - Version: ${VERSION}
          - Runner: GitHub Actions · ubuntu-24.04

          ### Installation

          \`\`\`bash
          chmod +x deepseek-harness-${VERSION}-linux-x64.AppImage
          ./deepseek-harness-${VERSION}-linux-x64.AppImage
          \`\`\`

          Versioned builds: \`v${VERSION}-linux-x64-custom\`

          ---

          源码 / Source: https://github.com/deepseek-ai/deepseek-harness
          Fork: https://github.com/yaoyingkeji/deepseek-harness
          EOF
          )
          gh release delete "$LATEST_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$LATEST_TAG" \
            "$ARTIFACTS"/*.AppImage \
            "$ARTIFACTS"/*.deb \
            "$ARTIFACTS"/SHA256SUMS.* \
            "$ARTIFACTS"/*.yml \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "DeepSeek Harness ${VERSION} (Linux x64 · latest)" \
            --notes "$LATEST_NOTES" \
            --prerelease

      - name: 刷新 linux-latest-official 自动更新源（官方构建版）
        if: inputs.publish && github.event.inputs.branch == 'linux-package-official'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACTS="apps/desktop/.desktop-build/targets/linux-x64/artifacts"
          LATEST_TAG="linux-latest-official"
          LATEST_NOTES=$(cat <<EOF
          ## :cn: 中文

          此 Release 是 DeepSeek Harness Linux x64 **官方构建版**的自动更新源。每次云端构建成功后会刷新至此版本，供应用内「检查更新」使用。

          - 版本：${VERSION}
          - 构建环境：GitHub Actions · ubuntu-24.04

          ### 安装

          \`\`\`bash
          chmod +x deepseek-harness-${VERSION}-linux-x64.AppImage
          ./deepseek-harness-${VERSION}-linux-x64.AppImage
          \`\`\`

          按版本发布的独立构建见：\`v${VERSION}-linux-x64-official\`

          ---

          ## :us: English

          This release is the **auto-update feed** for DeepSeek Harness Linux x64 Official Edition. It is refreshed with every successful cloud build and consumed by the in-app update checker.

          - Version: ${VERSION}
          - Runner: GitHub Actions · ubuntu-24.04

          ### Installation

          \`\`\`bash
          chmod +x deepseek-harness-${VERSION}-linux-x64.AppImage
          ./deepseek-harness-${VERSION}-linux-x64.AppImage
          \`\`\`

          Versioned builds: \`v${VERSION}-linux-x64-official\`

          ---

          源码 / Source: https://github.com/yaoyingkeji/deepseek-harness
          EOF
          )
          gh release delete "$LATEST_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$LATEST_TAG" \
            "$ARTIFACTS"/*.AppImage \
            "$ARTIFACTS"/*.deb \
            "$ARTIFACTS"/SHA256SUMS.* \
            "$ARTIFACTS"/*.yml \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "DeepSeek Harness ${VERSION} (Linux x64 · latest-official)" \
            --notes "$LATEST_NOTES" \
            --prerelease