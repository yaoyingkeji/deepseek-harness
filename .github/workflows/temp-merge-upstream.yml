name: Temp Merge Upstream

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout linux-custom-titlebar
        uses: actions/checkout@v4
        with:
          ref: linux-custom-titlebar
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "深圳市耀影科技有限公司"
          git config user.email "yaoyingkeji@yaoying.vip"

      - name: Merge master (allow conflicts)
        run: |
          git merge origin/master --no-commit --no-ff || true
          # 列出冲突文件
          echo "=== 冲突文件 ==="
          git diff --name-only --diff-filter=U

      - name: Resolve main.ts conflicts (keep both platform blocks)
        run: |
          python3 -c "
          import re
          with open('apps/desktop/src/main.ts', 'r') as f:
              content = f.read()
          # 删除冲突标记，保留两边代码（两个平台块互斥，都保留）
          content = re.sub(r'<<<<<<< HEAD\n', '', content)
          content = re.sub(r'\|\|\|\|\|\|\| merged common ancestors\n.*?=======\n', '', content, flags=re.DOTALL)
          content = re.sub(r'>>>>>>> .*?\n', '', content)
          with open('apps/desktop/src/main.ts', 'w') as f:
              f.write(content)
          "
          git add apps/desktop/src/main.ts
          echo "=== main.ts 冲突已解决（保留两个平台块）==="

      - name: Resolve main-startup.spec.ts conflicts (upstream priority)
        run: |
          python3 -c "
          import re
          with open('apps/desktop/tests/main-startup.spec.ts', 'r') as f:
              content = f.read()
          # 上游优先：取 theirs（master）侧，删除 ours 侧
          content = re.sub(r'<<<<<<< HEAD\n.*?=======\n', '', content, flags=re.DOTALL)
          content = re.sub(r'>>>>>>> .*?\n', '', content)
          with open('apps/desktop/tests/main-startup.spec.ts', 'w') as f:
              f.write(content)
          "
          git add apps/desktop/tests/main-startup.spec.ts
          echo "=== main-startup.spec.ts 冲突已解决（上游优先）==="

      - name: Resolve connection/package.json conflicts (upstream priority + keep fork remote-events)
        run: |
          python3 -c "
          import json, re
          with open('packages/client/connection/package.json', 'r') as f:
              raw = f.read()
          def parse_sides(text):
              # ours: between <<<<<<< HEAD and (||||||| base-block =======  OR  =======)
              m = re.search(r'<<<<<<< HEAD\n(.*?)(?:\|\|\|\|\|\|\| [^\n]*\n.*?=======\n|=======\n)', text, flags=re.DOTALL)
              ours = m.group(1) if m else None
              m2 = re.search(r'=======\n(.*?)>>>>>>> [^\n]*\n', text, flags=re.DOTALL)
              theirs = m2.group(1) if m2 else None
              return ours, theirs
          ours, theirs = parse_sides(raw)
          fork_pkg = json.loads(ours) if ours else {}
          master_pkg = json.loads(theirs) if theirs else {}
          # 以上游 master 为基准（version/zod 等取上游）
          merged = json.loads(json.dumps(master_pkg))
          # 保留 fork 的 ./remote-events 导出（上游没实现 -> 保留 fork 版本）
          if './remote-events' in fork_pkg.get('exports', {}):
              merged.setdefault('exports', {})['./remote-events'] = fork_pkg['exports']['./remote-events']
          # files: 保留 fork 的 remote-connection-request.js + 上游新增项
          merged_files = list(merged.get('files', []))
          for ff in fork_pkg.get('files', []):
              if ff not in merged_files and 'remote-connection-request' in ff:
                  if 'lib/types/**/*.d.ts' in merged_files:
                      merged_files.insert(merged_files.index('lib/types/**/*.d.ts'), ff)
                  else:
                      merged_files.append(ff)
          merged['files'] = merged_files
          with open('packages/client/connection/package.json', 'w') as f:
              json.dump(merged, f, indent=2, ensure_ascii=False)
              f.write('\n')
          "
          git add packages/client/connection/package.json
          echo "=== connection/package.json 冲突已解决（上游优先 + 保留 fork remote-events）==="

      - name: Verify no remaining conflicts
        run: |
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          if [ -n "$CONFLICTS" ]; then
            echo "❌ 仍有未解决的冲突: $CONFLICTS"
            exit 1
          fi
          echo "✅ 所有冲突已解决"

      - name: Commit merge
        run: |
          git commit --no-edit -m "Merge upstream master (dsh-0.2.2-rc.2, e8f7b93a) into linux-custom-titlebar

          同步上游 deepseek-ai/deepseek-harness master 最新代码（0.2.2-rc.2，923 commits）到 linux-custom-titlebar 分支。
          保留上游完整提交记录。
          冲突策略：上游有实现的以上游为准，上游没实现的保留 fork 版本。
          冲突文件解决方式：
          - main.ts: 保留两个平台块（Linux + win32 互斥，都保留）
          - main-startup.spec.ts: 上游优先（取 master 侧）
          - connection/package.json: 上游优先（version/zod 取 master），保留 fork 的 remote-events 导出与 remote-connection-request.js"

      - name: Push
        run: git push origin linux-custom-titlebar

      - name: Cleanup workflow file
        run: |
          git rm .github/workflows/temp-merge-upstream.yml
          git commit -m "chore: 移除临时 merge workflow"
          git push origin linux-custom-titlebar
