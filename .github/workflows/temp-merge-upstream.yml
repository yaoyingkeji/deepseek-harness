name: Temp Merge Upstream

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout linux-custom-titlebar
        uses: actions/checkout@v4
        with:
          ref: linux-custom-titlebar
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "深圳市耀影科技有限公司"
          git config user.email "yaoyingkeji@yaoying.vip"

      - name: Merge master (allow conflicts)
        run: |
          git merge origin/master --no-commit --no-ff || true
          # 列出冲突文件
          echo "=== 冲突文件 ==="
          git diff --name-only --diff-filter=U

      - name: Resolve main.ts conflicts (keep both platform blocks)
        run: |
          python3 -c "
          import re
          with open('apps/desktop/src/main.ts', 'r') as f:
              content = f.read()
          # 删除冲突标记，保留两边代码（两个平台块互斥，都保留）
          content = re.sub(r'<<<<<<< HEAD\n', '', content)
          content = re.sub(r'\|\|\|\|\|\|\| merged common ancestors\n.*?=======\n', '', content, flags=re.DOTALL)
          content = re.sub(r'>>>>>>> .*?\n', '', content)
          with open('apps/desktop/src/main.ts', 'w') as f:
              f.write(content)
          "
          git add apps/desktop/src/main.ts
          echo "=== main.ts 冲突已解决（保留两个平台块）==="

      - name: Resolve main-startup.spec.ts conflicts (upstream priority)
        run: |
          python3 -c "
          import re
          with open('apps/desktop/tests/main-startup.spec.ts', 'r') as f:
              content = f.read()
          # 上游优先：取 theirs（master）侧，删除 ours 侧
          content = re.sub(r'<<<<<<< HEAD\n.*?=======\n', '', content, flags=re.DOTALL)
          content = re.sub(r'>>>>>>> .*?\n', '', content)
          with open('apps/desktop/tests/main-startup.spec.ts', 'w') as f:
              f.write(content)
          "
          git add apps/desktop/tests/main-startup.spec.ts
          echo "=== main-startup.spec.ts 冲突已解决（上游优先）==="

      - name: Verify no remaining conflicts
        run: |
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          if [ -n "$CONFLICTS" ]; then
            echo "❌ 仍有未解决的冲突: $CONFLICTS"
            exit 1
          fi
          echo "✅ 所有冲突已解决"

      - name: Commit merge
        run: |
          git commit --no-edit -m "Merge upstream master (dsh-0.2.2-rc.2, e8f7b93a) into linux-custom-titlebar

          同步上游 deepseek-ai/deepseek-harness master 最新代码（0.2.2-rc.2，923 commits）到 linux-custom-titlebar 分支。
          保留上游完整提交记录。
          冲突策略：上游有实现的以上游为准，上游没实现的保留 fork 版本。
          冲突文件解决方式：
          - main.ts: 保留两个平台块（Linux + win32 互斥，都保留）
          - main-startup.spec.ts: 上游优先（取 master 侧）"

      - name: Push
        run: git push origin linux-custom-titlebar

      - name: Cleanup workflow file
        run: |
          git rm .github/workflows/temp-merge-upstream.yml
          git commit -m "chore: 移除临时 merge workflow"
          git push origin linux-custom-titlebar
